[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-procure-audit-ai"
version = "1.0.0"
description = "AI-powered procurement intelligence and bid analysis - local-first LLM agent"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ali Hassan"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core LLM Framework
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    
    # HTTP & Async
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    
    # Vector Database (pinned for Python 3.14 compat - no onnxruntime)
    "chromadb==0.4.24",
    # Pinned for compatibility
    "sentence-transformers>=3.0.0,<4.0.0",
    "transformers>=4.0.0,<5.0.0",
    
    # Web Search
    "tavily-python>=0.5.0",
    
    # OCR & Document Processing (CPU-Optimized)
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "PyMuPDF>=1.24.0",
    
    # Web Scraping
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    
    # API Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    
    # UI
    "streamlit>=1.35.0",
    
    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",
    
    # Config & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # Utilities (pinned for chromadb 0.4.24 compat)
    "numpy>=1.26.0,<2.0.0",
    "posthog<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
soi = "src.cli:cli"

[project.urls]
Homepage = "https://github.com/MrAliHasan/Agentic-Procure-Audit-AI"
Documentation = "https://github.com/MrAliHasan/Agentic-Procure-Audit-AI#readme"
Repository = "https://github.com/MrAliHasan/Agentic-Procure-Audit-AI"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
